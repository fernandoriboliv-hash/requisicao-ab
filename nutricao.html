<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nutrição — Rosewood A&B</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=202610091944">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js?v=202610091944"></script>
</head>
<body>

<!--
  Tela da nutrição (migration 95, pedido do Fernando em 08/10/2026).
  A nutricionista-chefe (perfil nutricionista) tem tudo; as estagiárias
  (perfil nutri_estagio) aferem temperatura, registram inspeção e veem as
  ocorrências — sem fichas e sem cadastro de equipamento. O banco confere
  as duas regras; aqui só não se oferece o que vai dar "sem permissão".
-->

<nav class="sidebar">
  <div class="sidebar-brand">
    <div class="name">Rosewood</div>
    <div class="sub" id="brandSub">A&amp;B · Nutrição</div>
  </div>
  <div class="sidebar-nav">
    <div class="nav-item" data-chefe onclick="goTab('painel',this)"><span class="nav-icon">◈</span> Painel</div>
    <div class="nav-item" onclick="goTab('afericao',this)"><span class="nav-icon">❄</span> Aferir temperatura</div>
    <div class="nav-item" onclick="goTab('ocorrencias',this)">
      <span class="nav-icon">△</span> Fora da faixa
      <span class="nav-badge" id="badgeOcorr"></span>
    </div>
    <div class="nav-item" onclick="goTab('inspecoes',this)"><span class="nav-icon">✓</span> Inspeções</div>
    <div class="nav-item" data-chefe onclick="goTab('fichas',this)"><span class="nav-icon">✎</span> Fichas Técnicas</div>
    <div class="nav-item" onclick="goTab('relatorio',this)"><span class="nav-icon">▣</span> Relatório mensal</div>
    <div class="nav-item" data-chefe onclick="goTab('equipamentos',this)"><span class="nav-icon">⚙</span> Equipamentos</div>
  </div>
  <div class="sidebar-foot">
    <div class="name" id="userName">—</div>
    <button class="logout-btn" onclick="logout()">Sair do sistema</button>
  </div>
</nav>

<div class="sidebar-overlay" id="sbOverlay" onclick="toggleSidebar()"></div>

<div class="main-with-sidebar">
  <div class="top-bar">
    <button class="sidebar-toggle" onclick="toggleSidebar()" aria-label="Abrir menu">☰</button>
    <div class="top-bar-hero">
      <div class="top-title" id="topTitle">Nutrição</div>
      <div class="top-sub" id="topSub"></div>
    </div>
  </div>

  <div class="main full">
    <div class="tab-content" id="tab-painel"><div id="pnRoot"></div></div>
    <div class="tab-content" id="tab-afericao"><div id="afRoot"></div></div>
    <div class="tab-content" id="tab-ocorrencias"><div id="ocRoot"></div></div>
    <div class="tab-content" id="tab-inspecoes"><div id="isRoot"></div></div>
    <div class="tab-content" id="tab-fichas"><div id="ftRoot"></div></div>
    <div class="tab-content" id="tab-relatorio"><div id="rlRoot"></div></div>
    <div class="tab-content" id="tab-equipamentos"><div id="eqRoot"></div></div>
  </div>
</div>

<div class="toast-stack" id="toasts"></div>

<script>
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const state = { user: null, perfil: null, pdvs: [], pdvsFichas: null };
// config.js lê o perfil de window.state.
window.state = state;

const tabTitles = {
  painel:       ['Painel', 'Aferição do dia, ocorrências e revisão das fichas'],
  afericao:     ['Aferir temperatura', 'Câmaras, geladeiras e climatização'],
  ocorrencias:  ['Fora da faixa', 'Ação corretiva e encerramento'],
  inspecoes:    ['Inspeções', 'Etiquetas, validade e armazenamento'],
  fichas:       ['Fichas Técnicas', 'Revisão de alergênicos'],
  relatorio:    ['Relatório mensal', 'Planilha de temperatura por área'],
  equipamentos: ['Equipamentos', 'Cadastro e faixa de temperatura'],
};

window.addEventListener('load', async () => {
  instalarAvisoConexao();
  const { data: { user } } = await sb.auth.getUser();
  if (!user) { window.location.href = 'index.html'; return; }
  const { data: perfil } = await sb.from('usuarios').select('id, perfil, nome, pdv_id').eq('auth_uid', user.id).single();
  if (!perfil || !['nutricionista', 'nutri_estagio', 'master_sistema'].includes(perfil.perfil)) {
    window.location.href = 'index.html'; return;
  }
  state.user = user; state.perfil = perfil;
  document.getElementById('userName').textContent = perfil.nome || '';
  const chefe = perfil.perfil !== 'nutri_estagio';
  if (!chefe) document.querySelectorAll('[data-chefe]').forEach(n => n.remove());
  document.getElementById('brandSub').textContent = 'A&B · ' + (LABEL_PERFIL[perfil.perfil] || 'Nutrição');

  // Cozinhas: as de comida, sem bar e sem o PDV de teste.
  const { data: pdvs } = await sb.from('pdvs').select('id, nome, tipo, ordem').eq('ativo', true).order('ordem');
  state.pdvs = (pdvs || []).filter(p => p.tipo !== 'bar' && !/IRD/i.test(p.nome)).map(p => ({ id: p.id, nome: p.nome }));
  // Inspeção: cozinhas e bares (09/10/2026). O IRD e o Bar - IRD são de teste.
  state.pdvsInsp = (pdvs || []).filter(p => !/IRD/i.test(p.nome)).map(p => ({ id: p.id, nome: p.nome, tipo: p.tipo }));

  sgAtualizarBadge();
  const inicio = chefe ? 'painel' : 'afericao';
  goTab(inicio, document.querySelector(`.nav-item[onclick*="goTab('${inicio}'"]`));
});

function escapeHtml(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function showToast(msg, tipo = 'info', duration = 4000) {
  const stack = document.getElementById('toasts');
  const t = document.createElement('div');
  t.className = 'toast ' + tipo; t.textContent = msg;
  stack.appendChild(t);
  setTimeout(() => t.remove(), duration);
}
async function logout() { await sb.auth.signOut(); window.location.href = 'index.html'; }
function toggleSidebar() {
  const s = document.querySelector('.sidebar'), ov = document.getElementById('sbOverlay');
  const open = !s.classList.contains('open');
  s.classList.toggle('open', open); ov.classList.toggle('open', open);
}

async function sgAtualizarBadge() {
  const n = await contarOcorrenciasAbertas();
  const b = document.getElementById('badgeOcorr');
  if (b) { b.textContent = n || ''; b.style.display = n ? '' : 'none'; }
}

// O módulo do config.js chama esta função para navegar (painel → fichas...).
window.sgIr = (aba, extra) => {
  const nav = document.querySelector(`.nav-item[onclick*="goTab('${aba}'"]`);
  goTab(aba, nav, extra);
};

// As cozinhas que têm ficha — a lista do seletor das fichas.
async function pdvsComFicha() {
  if (state.pdvsFichas) return state.pdvsFichas;
  let ids = [];
  for (let i = 0; ; i += 1000) {
    const { data } = await sb.from('fichas_tecnicas').select('pdv_id').eq('ativa', true).range(i, i + 999);
    ids = ids.concat((data || []).map(f => f.pdv_id));
    if (!data || data.length < 1000) break;
  }
  const tem = new Set(ids);
  state.pdvsFichas = state.pdvs.filter(p => tem.has(p.id));
  return state.pdvsFichas;
}

async function abrirFichas(pdvId) {
  const pdvs = await pdvsComFicha();
  if (!pdvs.length) { document.getElementById('ftRoot').innerHTML = '<div class="empty-text">Nenhuma ficha cadastrada.</div>'; return; }
  const id = pdvId || (_FT.pdvId && pdvs.some(p => p.id === _FT.pdvId) ? _FT.pdvId : pdvs[0].id);
  // Vindo do painel, abre já filtrando as pendentes.
  if (pdvId) _FT.filtroNutri = 'pendente';
  await montarFichas('#ftRoot', { pdvId: id, pdvNome: pdvs.find(p => p.id === id)?.nome || '', pdvs });
}

function goTab(aba, el, extra) {
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.getElementById('tab-' + aba)?.classList.add('active');
  if (el) el.classList.add('active');
  const [t, s] = tabTitles[aba] || [aba, ''];
  document.getElementById('topTitle').textContent = t;
  document.getElementById('topSub').textContent = s;
  if (aba === 'painel')       montarPainelNutri('#pnRoot');
  if (aba === 'afericao')     { _SG.areaSel = null; montarAfericao('#afRoot'); }
  if (aba === 'ocorrencias')  montarOcorrencias('#ocRoot');
  if (aba === 'inspecoes')    montarInspecoes('#isRoot', { modo: 'nutri', pdvs: state.pdvsInsp });
  if (aba === 'fichas')       abrirFichas(extra);
  if (aba === 'relatorio')    montarRelatorioTemperatura('#rlRoot');
  if (aba === 'equipamentos') montarEquipamentos('#eqRoot', { pdvs: state.pdvs });
  if (window.innerWidth <= 900) {
    document.querySelector('.sidebar')?.classList.remove('open');
    document.getElementById('sbOverlay')?.classList.remove('open');
  }
  window.scrollTo({ top: 0 });
}
</script>
</body>
</html>
